#
# overlay-rest.conf
#
# Build overlay for the rideyourstyle REST tracking API.
#
# Usage:
#   west build -b <board> -- -DEXTRA_CONF_FILE=overlay-rest.conf
#
# This overlay:
#  - Disables nRF Cloud (and with it CoAP transport, FOTA, A-GNSS, provisioning)
#  - Enables the plain-HTTP REST cloud module (APP_CLOUD)
#  - Enables the TCP stack and HW-ID library needed by the REST module
#

# ---------------------------------------------------------------------------
# Disable nRF Cloud and everything that depends on it
# ---------------------------------------------------------------------------

# Disabling NRF_CLOUD cascades to NRF_CLOUD_COAP, NRF_CLOUD_FOTA_POLL,
# NRF_CLOUD_AGNSS, NRF_CLOUD_REST, NRF_PROVISIONING, etc.
CONFIG_NRF_CLOUD=n

# ---------------------------------------------------------------------------
# Disable nRF Provisioning and its dependencies
# (prj.conf enables these; they require modem_key_mgmt which needs NRF_CLOUD)
# ---------------------------------------------------------------------------

CONFIG_NRF_PROVISIONING=n
CONFIG_MODEM_ATTEST_TOKEN=n

# ---------------------------------------------------------------------------
# Silence Kconfig warnings: Zephyr v4.x treats every warning as a build error.
# prj.conf assigns these symbols to 'y', but they depend on NRF_CLOUD or
# NRF_PROVISIONING (both disabled above). Override to 'n' so the assigned
# value matches the actual value and no warning is emitted.
# ---------------------------------------------------------------------------

# nRF Cloud subsystems
CONFIG_NRF_CLOUD_COAP=n
CONFIG_NRF_CLOUD_COAP_DOWNLOADS=n
CONFIG_NRF_CLOUD_COAP_DISCONNECT_ON_FAILED_REQUEST=n
CONFIG_NRF_CLOUD_CHECK_CREDENTIALS=n
CONFIG_NRF_CLOUD_FOTA_POLL=n
CONFIG_NRF_CLOUD_FOTA_FULL_MODEM_UPDATE=n
CONFIG_NRF_CLOUD_AGNSS=n
CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS=n
CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS_NETWORK=n
CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS_SIM=n
CONFIG_NRF_CLOUD_SEND_SERVICE_INFO_FOTA=n

# nRF Cloud client ID / credentials (choice symbols — set to n to deselect)
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_INTERNAL_UUID=n
CONFIG_NRF_CLOUD_CREDENTIALS_MGMT_MODEM=n

# nRF Cloud FOTA log level choice (choice inside disabled NRF_CLOUD_FOTA_POLL)
CONFIG_NRF_CLOUD_FOTA_POLL_LOG_LEVEL_DBG=n

# nRF Provisioning subsystems
CONFIG_NRF_PROVISIONING_WITH_CERT=n
CONFIG_NRF_PROVISIONING_COAP=n
CONFIG_NRF_PROVISIONING_CODEC=n
CONFIG_NRF_PROVISIONING_CBOR=n

# nRF Provisioning log level choice (choice inside disabled NRF_PROVISIONING)
CONFIG_NRF_PROVISIONING_LOG_LEVEL_DBG=n

# FOTA app module log level choice (APP_FOTA disabled when NRF_CLOUD_FOTA_POLL=n)
CONFIG_APP_FOTA_LOG_LEVEL_DBG=n

# ---------------------------------------------------------------------------
# Enable the REST cloud module
# ---------------------------------------------------------------------------

# APP_CLOUD normally defaults to y only when NRF_CLOUD_COAP=y.
# Override that default so our replacement module is compiled.
CONFIG_APP_CLOUD=y

# ---------------------------------------------------------------------------
# TCP + HTTP
# ---------------------------------------------------------------------------

CONFIG_NET_TCP=y
CONFIG_HTTP_CLIENT=y

# HW-ID library - provides hw_id_get() used to read the modem IMEI
CONFIG_HW_ID_LIBRARY=y
CONFIG_HW_ID_LIBRARY_SOURCE_IMEI=y
CONFIG_APP_CLOUD_REST_SERVER_HOST="dev.tracking.rideyourstyle.ch"
CONFIG_APP_CLOUD_REST_SERVER_PORT=443
CONFIG_APP_CLOUD_REST_TLS=y
CONFIG_APP_CLOUD_REST_API_KEY="86410295daa39ea644a2578197c6672679c254095491fad31850521b64f377f7"
CONFIG_APP_CLOUD_REST_TRACKER_ID_OVERRIDE=y
CONFIG_APP_CLOUD_REST_TRACKER_ID_FALLBACK="90D0BE69"
CONFIG_APP_CLOUD_REST_GNSS_MIN_ACCURACY_METERS=25

# ---------------------------------------------------------------------------
# Location: GNSS only — disable WiFi and cellular location methods
# ---------------------------------------------------------------------------

CONFIG_LOCATION_METHOD_WIFI=n
CONFIG_LOCATION_METHOD_CELLULAR=n
CONFIG_LOCATION_REQUEST_DEFAULT_METHOD_FIRST_GNSS=y
CONFIG_LOCATION_REQUEST_DEFAULT_METHOD_SECOND_NONE=y
CONFIG_LOCATION_REQUEST_DEFAULT_METHOD_THIRD_NONE=y

# Disable obstructed-sky early-cancel (tuned for A-GNSS, too aggressive without it)
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_VISIBILITY_DETECTION=n

# No timeout — search until fix (0 = unlimited)
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_TIMEOUT=0
CONFIG_LOCATION_REQUEST_DEFAULT_TIMEOUT=0

# GNSS priority mode: modem gives GNSS longer time windows at the expense of LTE throughput
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_PRIORITY_MODE=y

# Larger log buffer so long JSON payloads are not truncated in debug output
CONFIG_LOG_BUFFER_SIZE=4096
# Process log thread wakes more often to drain the buffer faster
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=5

# Verbose GNSS logs
CONFIG_LOCATION_LOG_LEVEL_DBG=y

# ---------------------------------------------------------------------------
# Sampling and send intervals
# ---------------------------------------------------------------------------

CONFIG_APP_SAMPLING_INTERVAL_SECONDS=60
CONFIG_APP_CLOUD_UPDATE_INTERVAL_SECONDS=600

# ---------------------------------------------------------------------------
# Storage: LittleFS on external SPI NOR flash (GD25LE255E, 32 MB)
#
# 8 MB partition → ~28 000 location records → ≈ 19 days at 60 s intervals.
# Data survives power loss and resets (unlike RAM backend).
# ---------------------------------------------------------------------------

# SPI NOR flash driver
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y

# LittleFS backend (replaces RAM ring buffer — frees ~40 KB RAM)
CONFIG_APP_STORAGE_BACKEND_LITTLEFS=y

# 8 MB partition on external flash (PM overrides the DTS placeholder)
CONFIG_PM_PARTITION_SIZE_LITTLEFS=0x800000

# Maximum records per data type — LittleFS manages the space; 20 000 × 280 B ≈ 5.6 MB
CONFIG_APP_STORAGE_MAX_RECORDS_PER_TYPE=20000

# Session timeout — safety net; each HTTP request takes at most 30 s
CONFIG_APP_STORAGE_SESSION_TIMEOUT_SECONDS=60

# ---------------------------------------------------------------------------
# LTE PSM — modem sleeps at ~2 µA between send intervals
# ---------------------------------------------------------------------------

CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU="00100001"   # T3412: 10 min periodic TAU (matches send interval)
CONFIG_LTE_PSM_REQ_RAT="00000000"     # T3324: active timer 0 s — sleep immediately after send

# ---------------------------------------------------------------------------
# Modem traces disabled (production build)
# ---------------------------------------------------------------------------

CONFIG_NRF_MODEM_LIB_TRACE=n

# ---------------------------------------------------------------------------
# Location: keep LOCATION_SERVICE_EXTERNAL at its default.
#
# Setting it to n would remove the cloud_location_request field from
# struct location_event_data, causing a compile error in location.c.
# Cloud location requests from the location module will arrive on
# location_chan as LOCATION_CLOUD_REQUEST events and are silently ignored
# by the REST cloud module; GNSS-only fixes still work normally.
# ---------------------------------------------------------------------------
